[package]
name = "photovault-core"
description = "PhotoVault domain core: catalog, ingestion, thumbnails. No Tauri dependency."
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
tracing.workspace = true
specta.workspace = true
# Only for `#[specta(type = Number)]` on byte counts (exact up to 2^53).
specta-typescript = "0.0.12"
walkdir = "2"
image = "0.25"
dirs = "6"
sysinfo = { version = "0.39", default-features = false, features = ["disk"] }
nom-exif = "3.8"
fast_image_resize = { version = "6", features = ["image"] }
webp = "0.3"
image_hasher = "3.1"
flate2 = "1"
regex = "1"
sha2 = "0.10"
# Optional "send to the system trash" (PRD §16).
trash = "5"
base64 = "0.22"
ndarray = "0.17"
# Tokenizer of the multilingual text encoder; fancy-regex (pure Rust) instead of onig (C).
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
# Model download (the only network access, on request); rustls, no OpenSSL.
ureq = { version = "3", default-features = false, features = ["rustls"] }

# Local AI (phase 7): ONNX Runtime.
# Windows (and others): statically linked (portable: no DLL to ship), downloaded at build
# time over rustls (no OpenSSL needed on the build machine).
[target.'cfg(not(target_os = "linux"))'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "download-binaries", "tracing"] }
ort-sys = { version = "=2.0.0-rc.13", default-features = false, features = ["tls-rustls"] }

# Linux: loaded at run time from Microsoft's official build (bundled in the AppImage by
# `scripts/fetch-onnxruntime.mjs`). The static one needs glibc 2.38+ / GCC 13 and wouldn't
# link on Ubuntu 22.04 (nor run on older distros); Microsoft's needs glibc 2.27.
[target.'cfg(target_os = "linux")'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "load-dynamic", "tracing"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
