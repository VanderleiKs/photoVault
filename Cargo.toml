[workspace]
resolver = "3"
members = ["crates/photovault-core", "src-tauri"]

[workspace.package]
version = "2.0.0"
edition = "2024"
authors = ["PhotoVault"]

[workspace.dependencies]
photovault-core = { path = "crates/photovault-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "migrate", "macros"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
specta = { version = "=2.0.0-rc.25", features = ["derive", "chrono"] }

# Dependencies (image decoding, SQLite) are optimized even in dev builds;
# our own crates stay unoptimized for debugging.
[profile.dev.package."*"]
opt-level = 2
